name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag para la imagen (ej. v1.0.0 o latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://papermark.example.com' }}
            NEXT_PUBLIC_MARKETING_URL=${{ vars.NEXT_PUBLIC_MARKETING_URL || 'https://papermark.example.com' }}
            NEXT_PUBLIC_APP_BASE_HOST=${{ vars.NEXT_PUBLIC_APP_BASE_HOST || 'papermark.example.com' }}
            NEXT_PUBLIC_API_BASE_HOST=${{ vars.NEXT_PUBLIC_API_BASE_HOST || 'api.papermark.example.com' }}
            NEXT_PUBLIC_MCP_BASE_HOST=${{ vars.NEXT_PUBLIC_MCP_BASE_HOST || 'mcp.papermark.example.com' }}
            NEXT_PUBLIC_WEBHOOK_BASE_HOST=${{ vars.NEXT_PUBLIC_WEBHOOK_BASE_HOST || 'hooks.papermark.example.com' }}
            NEXT_PUBLIC_WEBHOOK_BASE_URL=${{ vars.NEXT_PUBLIC_WEBHOOK_BASE_URL || 'https://papermark.example.com' }}
            NEXT_PUBLIC_UPLOAD_TRANSPORT=${{ vars.NEXT_PUBLIC_UPLOAD_TRANSPORT || 's3' }}
            NEXT_PRIVATE_UPLOAD_DISTRIBUTION_HOST=${{ vars.NEXT_PRIVATE_UPLOAD_DISTRIBUTION_HOST || 'your-bucket.s3.us-east-1.amazonaws.com' }}
